<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8"/>
    <title>GamesOnline it's the place to play!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="frivIcon.png">

    <meta name="description" content="You can with some great online games!">
    
    <style>
        @font-face {
            font-family: frivFont;
            src: url(frivFont.woff);
            font-display: swap;
        }

        body {
            background-color: #25c;
            margin: 0;
            animation-name: backColor;
            animation-duration: 180s;
            animation-iteration-count: infinite;
            font-family: arial, sans-serif;
            overflow: hidden;
        }

        #clickArea {
            position: absolute;
            bottom: 0;
            height: 100vh;
            width: 100vw;
            cursor: pointer;
        }

        h1,
        h2 {
            text-align: center;
            font-family: frivFont, arial, helvetica, sans-serif;
            color: #fff;
            font-size: 9vmax;
            margin-top: -10vh;
            /* xxx */
            text-shadow: 0.5vmax 0.5vmax 0 rgba(0, 0, 0, .3);
        }

        h2 {
            font-size: 3vmax;
            text-shadow: 0.2vmax 0.2vmax 0 rgba(0, 0, 0, .3);
            color: paleGoldenRod;
            letter-spacing: 1vmax;
            animation: h2Attract 5s infinite;
        }

        @keyframes h2Attract {

            96% {
                opacity: 1;
            }

            97% {
                opacity: 0;
            }

            98% {
                opacity: 1;
            }

            99% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes backColor {
            0% {
                background-color: #25c;
            }

            25% {
                background-color: dodgerblue;
            }

            50% {
                background-color: cyan;
            }

            75% {
                background-color: dodgerblue;
            }

            100% {
                background-color: #25c;
            }
        }

        #shape1 {
            z-index: -10;
            margin-left: 50vw;
            margin-top: 0;
            position: fixed;
            opacity: .03;
            animation-name: shape1Rotate;
            animation-duration: 70s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate
        }

        @keyframes shape1Rotate {
            0% {
                transform: rotate(0)
            }

            100% {
                transform: rotate(360deg)
            }
        }

        #shape2 {
            z-index: -20;
            margin-left: 10vw;
            margin-top: 0;
            position: fixed;
            opacity: .05;
            animation-name: shape2Rotate;
            animation-duration: 40s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate
        }

        @keyframes shape2Rotate {
            0% {
                transform: rotate(0)
            }

            100% {
                transform: rotate(360deg)
            }
        }

        #shape3 {
            z-index: -10;
            margin-left: 0;
            margin-top: -20vh;
            position: fixed;
            opacity: .05;
            animation-name: shape3Rotate;
            animation-duration: 30s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate
        }

        @keyframes shape3Rotate {
            0% {
                transform: rotate(360deg)
            }

            100% {
                transform: rotate(0)
            }
        }

        #topBar {
            background-image: url("thumbs/gamesonline360x100Min.png");
            position: absolute;
            top: -100px;
            height: 100px;
            width: 100vw;
            animation: topBarSlideIn 2s 1s ease-out forwards;
        }

        @keyframes topBarSlideIn {
            to {
                top: 0;
            }
        }

        #topBarDarkness {
            position: absolute;
            background: rgba(0, 0, 0, .2);
            top: 100px;
            left: -100vw;
            height: 2vh;
            width: 100vw;
            animation: topBarDarknessSlideIn 1s 3s ease-out forwards;
        }

        @keyframes topBarDarknessSlideIn {
            to {
                left: 0;
            }
        }

        #bottomBar {
            background-image: url("thumbs/gamesonline360x100Min.png");
            position: fixed;
            bottom: -100px;
            height: 100px;
            width: 100vw;
            animation: bottomBarSlideIn 2s 1s ease-out forwards;
        }

        @keyframes bottomBarSlideIn {
            to {
                bottom: 0;
            }
        }

        #bottomBarDarkness {
            position: fixed;
            background: rgba(0, 0, 0, .2);
            bottom: 100px;
            left: 100vw;
            height: 2vh;
            width: 100vw;
            animation: bottomBarDarknessSlideIn 1s 3s ease-out forwards;
        }

        @keyframes bottomBarDarknessSlideIn {
            to {
                left: 0;
            }
        }

        #gameDescription {
            text-align: center;
            font-family: frivFont, arial, helvetica, sans-serif;
            font-size: 2vmax;
            font-weight: bold;
            color: rgba(0, 0, 0, .5);
            opacity: 0;
            background: rgba(0, 0, 0, .1);
            border-radius: 2vw;
            margin: 0;
            padding: 0.5vw;
            position: absolute;
            width: 80vw;
            top: 69%;
            transform: translate(10%, -50%);
            animation: gameDescriptionFadeIn 2s 20s ease-out forwards;
        }

        @keyframes gameDescriptionFadeIn {
            to {
                opacity: 1;
            }
        }

        #clickText {
            margin: 0;
            position: absolute;
            width: 100vw;
            top: 50%;
            transform: translate(0, -70%);
        }

        #linksContainer {
            line-height: 100px;
            height: 100px;
            text-align: center;
            opacity: 0;
            animation: linksContainerFadeIn 2s 4s ease-out forwards;
        }

        @keyframes linksContainerFadeIn {
            to {
                opacity: 1;
            }
        }

        .gameLink {
            background-color: rgba(0, 0, 0, 0.7);
            font-family: frivFont, arial, helvetica, sans-serif;
            font-size: calc(0.7vmax + 12px);
            font-weight: bold;
            margin: 1vmax;
            padding: 0.5vmax;
            padding-left: 2vmax;
            padding-right: 2vmax;
            border-radius: 1vmax;
        }

        @media only screen and (max-width: 1000px) {
            #linksContainer {
                display: none;
            }
            h2 {
            margin-top: 0;
            }
        }
        
        a {
            text-decoration: none;
        }

        a:link,
        a:visited {
            color: white;
        }

        a:hover,
        a:active {
            color: palegoldenrod;
        }

    </style>

</head>

<body>

    <svg height="2048" id="shape1" width="2048">
        <circle cx="400" cy="400" fill="white" r="300"/></svg>
    <svg height="2048" id="shape2" width="2048">
        <polygon points="1000,100 400,1980 1900,780 100,780 1600,1980" style="fill:#fff"/></svg>
    <svg height="2048" id="shape3" width="2048">
        <circle cx="400" cy="400" fill="white" r="300"/></svg>

    <div id="topBar"></div>
    <div id="topBarDarkness"></div>
    <div id="bottomBar">

    </div>
    <div id="bottomBarDarkness"></div>

    <div id="gameDescription">
        <p>Long ago, GamesOnline hosted some really neat Flash games. They don't work any more, but if you click, you will be entertained..!</p>
    </div>

    <div id="clickText">
        <h1>GamesOnline</h1>
        <h2 id="clickToPlay">CLICK TO PLAY!</h2>
    </div>

    <div id="clickArea"></div>


    <script>

        clickArea.onclick = function() {
            window.open("https://www.friv.com/", "_top");
        }

        var lang = navigator.language.toLowerCase();
        var shortLang = lang.slice(0, 2);
        if (shortLang != "en") {
            gameDescription.style.display = "none";
        }

        switch (shortLang) {
            case "es":
                clickToPlay.innerHTML = "¡CLIC PARA JUGAR!";
                break;
            case "fr":
                clickToPlay.innerHTML = "CLIQUEZ POUR JOUER!";
                break;
            case "pt":
                clickToPlay.innerHTML = "CLIQUE PARA JOGAR!";
                break;
            default:
                //noop
        }

    </script>
